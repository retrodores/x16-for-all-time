name: Publish X16 For All Time 1.0.5

on:
  push:
    branches: [release-publish-1.0.5]
    paths: [.github/workflows/publish-1.0.5.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/v1.0.5
          persist-credentials: false

      - name: Find MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build and test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\Build.ps1
          $installer = Join-Path $PWD 'dist\X16ForAllTime-1.0.5-Setup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'x16-fat-install-test'
          $log = Join-Path $env:RUNNER_TEMP 'x16-fat-install.log'
          $setup = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS',
            ('/DIR="' + $installDir + '"'), ('/LOG="' + $log + '"')
          )
          if ($setup.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 50 }
            throw "Installer exited with status $($setup.ExitCode)."
          }
          foreach ($file in @('X16ForAllTime.exe', 'X16ForAllTime.exe.config', 'X16.ps1')) {
            $built = Get-FileHash (Join-Path 'Launcher\bin\Release' $file)
            $installed = Get-FileHash (Join-Path $installDir $file)
            if ($built.Hash -ne $installed.Hash) { throw "Installed $file differs from the build." }
          }
          $app = Get-Item (Join-Path $installDir 'X16ForAllTime.exe')
          if ($app.VersionInfo.FileVersion -ne '1.0.5.0') { throw 'Unexpected installed launcher version.' }
          Write-Host 'Verified Windows installation and installed launcher version 1.0.5.'
          Get-FileHash $installer

      - name: Publish the stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          X16 For All Time 1.0.5 makes it easier to test a program while you develop it and to try software from X16 Files and SD Card Kit.

          ### Run intermediate builds during development

          - Use **Run once…** to open a local PRG, BAS, or ZIP without adding it to Favorites. Choose the emulator build and profile, or adjust CPU, clock, RAM, and other launch settings for that run.
          - The launcher recalls your last successful Run once setup across restarts and updates. Switch between emulator builds or 65C02 and 65C816 profiles from the same dialog.
          - Record over an existing GIF when repeating a test. For local ZIPs, relative recording paths resolve beside the original archive, so the GIF survives cleanup.
          - The configuration dialogs are wider. Long file paths stay on one line, and command previews scroll horizontally.

          ### Browse, try, and keep programs

          - Double-click a runnable item in **X16 Files** or **SD Card Kit** to run it once. If a package has several startup programs and no entry point is specified, pick one first. Then choose the emulator and profile, just as you would for a local test build.
          - Choose **Install to Favorites** when you want a permanent entry. The former Start list is now **Favorites**, and existing entries and settings carry over.
          - **Edit program…** sits next to **Run** below the Favorites list. Pressing **Delete** in the list opens the existing file deletion confirmation.

          **Installation:** Download and run the setup executable below. Requires Windows 10 or later and .NET Framework 4.8 or later.

          [User guide and wiki](https://github.com/retrodores/x16-for-all-time/wiki)
          '@
          $notesFile = Join-Path $env:RUNNER_TEMP 'x16-fat-release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release create v1.0.5 'dist/X16ForAllTime-1.0.5-Setup.exe' --repo $env:GITHUB_REPOSITORY --verify-tag --latest --title 'X16 For All Time 1.0.5' --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
